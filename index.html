<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre Elemental: Defensa del Reino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227; --gold-hi:#ffe08a; --panel:#1e1830; --panel2:#262040;
  --ink:#0d0a14; --text:#d8d0e8; --dim:#8a82a0; --danger:#ff5a4a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #2a2340 0%, #14101c 55%, #0a0810 100%);
  color:var(--text);
  font-family:'Press Start 2P', monospace;
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh; padding:10px 12px 20px;
  -webkit-user-select:none; user-select:none;
}
header{
  width:100%; max-width:1280px;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; margin-bottom:10px;
}
h1{
  font-size:14px; color:var(--gold-hi);
  text-shadow:2px 2px 0 #4a2f00, 4px 4px 0 #000;
  letter-spacing:1px;
}
h1 span{color:#7fd4ff; text-shadow:2px 2px 0 #0a3a55, 4px 4px 0 #000;}
#hud{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.hud-chip{
  background:var(--panel); border:2px solid #3a3054; padding:6px 10px;
  font-size:9px; display:flex; gap:6px; align-items:center;
  box-shadow:inset 0 0 0 1px #00000055;
}
.hud-chip b{color:var(--gold-hi);}
#hud-lives b{color:#ff7a6a;}
#hud-wave b{color:#8fd4ff;}
.hbtn{
  font-family:inherit; font-size:8px; cursor:pointer;
  background:var(--panel2); color:var(--text);
  border:2px solid #4a4070; padding:6px 10px;
  box-shadow:0 3px 0 #0a0810;
}
.hbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #0a0810;}
.hbtn.on{background:#3a2f55; border-color:var(--gold); color:var(--gold-hi);}
main{
  width:100%; max-width:1280px;
  display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;
}
#stagecol{flex:1 1 640px; min-width:320px; display:flex; flex-direction:column; gap:10px;}
#stage{position:relative; background:#000; border:3px solid #3a2f1d; box-shadow:0 0 0 3px #100c06, 0 10px 30px #000a;}
#stage::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, #0000 0 2px, #00000018 2px 3px);
}
canvas#game{
  display:block; width:100%; aspect-ratio:4/3;
  image-rendering:pixelated; image-rendering:crisp-edges; background:#0a0d08;
}
#toasts{position:absolute; top:8px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; z-index:5;}
.toast{
  background:#000000d0; border:2px solid var(--gold); color:var(--gold-hi);
  font-size:8px; padding:6px 10px; animation:toastIn .2s steps(3);
}
@keyframes toastIn{from{transform:translateY(-8px); opacity:0;} to{transform:none; opacity:1;}}
#banner{
  position:absolute; top:38%; left:0; right:0; text-align:center; pointer-events:none;
  font-size:22px; color:#fff; z-index:4;
  text-shadow:3px 3px 0 #000, 0 0 18px #7fd4ff88;
  opacity:0; transition:opacity .3s;
}
#banner.show{opacity:1;}
#infobar{
  background:var(--panel); border:2px solid #3a3054; min-height:74px;
  padding:8px 10px; font-size:8px; line-height:1.9;
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
#infobar .ttl{color:var(--gold-hi); font-size:9px;}
#infobar .st{color:var(--dim);}
#infobar .st b{color:var(--text);}
.synchip{display:inline-block; border:1px solid; padding:2px 5px; margin:2px 4px 0 0; font-size:7px;}
.ibtn{
  font-family:inherit; font-size:8px; cursor:pointer; padding:7px 10px;
  border:2px solid #4a4070; background:var(--panel2); color:var(--text); box-shadow:0 3px 0 #0a0810;
}
.ibtn:active{transform:translateY(2px); box-shadow:0 1px 0 #0a0810;}
.ibtn.go{background:#2f4a24; border-color:#5a9a4a; color:#b8e8a0;}
.ibtn.gold{background:#4a3a14; border-color:var(--gold); color:var(--gold-hi);}
.ibtn:disabled{opacity:.45; cursor:not-allowed;}
#hint{font-size:7px; color:var(--dim); text-align:center; line-height:2;}
#shop{
  flex:0 0 264px; background:var(--panel); border:2px solid #3a3054; padding:10px;
  display:flex; flex-direction:column; gap:8px;
}
#shop h2{font-size:10px; color:var(--gold-hi); text-shadow:2px 2px 0 #000;}
.card{
  display:flex; gap:8px; align-items:center; cursor:pointer;
  background:var(--panel2); border:2px solid #3a3054; padding:6px;
  transition:none;
}
.card:hover{border-color:#6a5a9a;}
.card.sel{border-color:var(--gold); background:#3a2f55;}
.card canvas{image-rendering:pixelated; background:#0d0a14; border:1px solid #000;}
.card .nm{font-size:8px; color:var(--text);}
.card .cs{font-size:8px; color:var(--gold-hi);}
.card .el{font-size:7px; padding:2px 4px; border:1px solid; margin-left:auto;}
#btn-wave{
  font-family:inherit; font-size:9px; cursor:pointer; padding:10px;
  background:#3a5524; color:#d8ffb0; border:2px solid #6a9a4a; box-shadow:0 4px 0 #101a08;
}
#btn-wave:disabled{background:#262040; color:var(--dim); border-color:#3a3054; box-shadow:none; cursor:default;}
#btn-wave:not(:disabled){animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);}}
#wave-prev{font-size:7px; color:var(--dim); line-height:2.2; border-top:1px dashed #3a3054; padding-top:8px;}
#wave-prev .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
#wave-prev canvas{image-rendering:pixelated;}
#wave-prev .cnt{color:var(--text);}
#wave-prev .boss{color:var(--danger);}
#wave-prev .wmarks{display:inline-flex; gap:2px; align-items:center;}
#wave-prev .wmark{font-size:8px; line-height:1;}
#overlay .bestiary-t{color:#8fd4ff; font-size:9px; text-shadow:2px 2px 0 #000;}
#overlay .bestiary{display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:8px; max-width:900px; width:100%;}
#overlay .bestc{background:#1e1830cc; border:2px solid #3a3054; padding:8px; font-size:7px; line-height:2.2; text-align:left;}
#overlay .bestc b{color:#e8d8a0; font-size:8px;}
#overlay .bestc .st{color:var(--dim);}
@media (max-width:1100px){
  #overlay .bestiary{grid-template-columns:repeat(2,minmax(150px,1fr));}
}
#overlay{
  position:absolute; inset:0; background:#0a0810e8; z-index:10;
  display:flex; text-align:center; padding:20px; overflow:auto;
}
#overlay>.opanel{margin:auto; display:flex; flex-direction:column; align-items:center; gap:14px;}
#overlay.hidden{display:none;}
#overlay .big{font-size:20px; color:var(--gold-hi); text-shadow:3px 3px 0 #4a2f00, 6px 6px 0 #000; line-height:1.6;}
#overlay .sub{font-size:9px; color:var(--text); line-height:2.2; max-width:640px;}
#overlay .cols{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:900px;}
#overlay .col{
  background:#1e1830cc; border:2px solid #3a3054; padding:12px; font-size:7px;
  line-height:2.4; text-align:left; max-width:280px;
}
#overlay .col h3{color:#8fd4ff; font-size:8px; margin-bottom:8px; text-align:center;}
#overlay .col .c{color:var(--gold-hi);}
#overlay .btn{
  font-family:inherit; font-size:12px; cursor:pointer; padding:14px 26px; margin-top:6px;
  background:#3a5524; color:#eaffd0; border:3px solid #7ab05a; box-shadow:0 5px 0 #101a08;
}
#overlay .btn:active{transform:translateY(3px); box-shadow:0 2px 0 #101a08;}
#overlay .stat{font-size:9px; color:var(--text); line-height:2.4;}
#overlay .maps{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:760px;}
#overlay .mapc{background:#1e1830cc; border:2px solid #3a3054; padding:8px 10px; font-size:7px;
  line-height:2; text-align:left; width:182px; cursor:pointer; transition:none;}
#overlay .mapc:hover{border-color:#8fd4ff;}
#overlay .mapc.on{border-color:var(--gold); background:#3a2f55; box-shadow:0 0 0 2px #4a2f00;}
#overlay .mapc b{color:#e8d8a0; font-size:8px;}
#overlay .mapc .stars{color:var(--gold); letter-spacing:1px;}
#overlay .mapc .md{color:var(--dim);}
#overlay .lb{background:#1e1830cc; border:2px solid #3a3054; padding:8px 14px; font-size:7px;
  line-height:2.4; min-width:220px; max-width:300px; text-align:left;}
#overlay .lb h3{color:var(--gold-hi); font-size:8px; margin-bottom:4px; text-align:center;}
#overlay .lb .row{display:flex; justify-content:space-between; gap:14px;}
#overlay .lb .row .n{color:#8fd4ff;}
#overlay .lb .row .s{color:var(--gold-hi);}
#overlay input#pname{background:#0d0a14; border:2px solid #3a3054; color:var(--gold-hi);

#overlay input#pname:focus{border-color:var(--gold);}
@media (max-width:900px){
  #shop{flex:1 1 100%; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  #shop h2, #btn-wave, #wave-prev{grid-column:1/-1;}
}

<header>
  <h1>⚔ TORRE <span>ELEMENTAL</span></h1>
  <div id="hud">
    <div class="hud-chip" id="hud-lives">❤ <b id="hud-lives-v">20</b></div>
    <div class="hud-chip">💰 <b id="hud-gold-v">130</b></div>
    <div class="hud-chip" id="hud-wave">Oleada <b id="hud-wave-v">0/18</b></div>
    <div class="hud-chip" id="hud-phase">Preparando</div>
    <button class="hbtn" id="btn-speed">VELOCIDAD 1x</button>

<main>
  <div id="stagecol">
    <div id="stage">
      <canvas id="game" width="320" height="240"></canvas>

      <div id="banner"></div>
      <div id="overlay"></div>
    </div>
    <div id="infobar"><span class="st">Selecciona una torre del panel para construir. Clic sobre una torre colocada para mejorarla.</span></div>
    <div id="hint">CLIC: construir/inspeccionar · U: mejorar · S: vender · ESPACIO: oleada · P: pausa · F: velocidad · M: sonido · 1-7: elegir torre</div>
  </div>
  <aside id="shop">
    <h2>TORRES</h2>
    <div id="cards"></div>
    <button id="btn-wave">▶ INICIAR OLEADA [ESPACIO]</button>
    <div id="wave-prev"></div>
  </aside>
</main>
<script>
'use strict';
/* =====================================================================
   TORRE ELEMENTAL — Defensa del Reino
   TD medieval pixel-art · ataques elementales · sinergias de torres
   ===================================================================== */

// ---------- utilidades ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry32(1337);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));

// ---------- mapas (3 mapas temáticos, selección en el menú) ----------
const CELL=16, COLS=20, ROWS=15, W=COLS*CELL, H=ROWS*CELL;
// wp: waypoints en coordenadas de celda ([-1,r] = entra por la izquierda, [20,r] = sale por la derecha)
const MAPS=[
  {id:'pradera', name:'Pradera del Reino', stars:1,
   desc:'El camino serpenteante del valle. Dificultad normal · premio x1.0.',
   seed:1337, diff:{hp:1.0,spd:1.0,bounty:1.0},
   theme:{ground:['#3a7d2c','#3f8a32','#357328'],speckle:['#2f6b24','#4a9136'],
          path:['#8a6a3f','#91714a','#84643c'],speckleP:['#75572f','#9c7a4a'],
          edge:'#6b4f2e',flowers:true,deco:'tree'},
   wp:[[-1,2],[14,2],[14,5],[4,5],[4,8],[15,8],[15,11],[5,11],[5,13],[20,13]],
   spawn:[0,2], castle:[18,13], decos:14},
  {id:'bosque', name:'Bosque Sombrío', stars:2,
   desc:'Horquilla entre los pinos. Enemigos más duros y rápidos · premio x1.15.',
   seed:4242, diff:{hp:1.12,spd:1.04,bounty:1.15},
   theme:{ground:['#2c5f22','#316a27','#27541f'],speckle:['#1f4a1a','#3a7a2e'],
          path:['#7a5c35','#866840','#725430'],speckleP:['#5c4426','#8a6c42'],
          edge:'#4a3a1e',flowers:false,deco:'pine'},
   wp:[[-1,12],[3,12],[3,2],[16,2],[16,13],[20,13]],
   spawn:[0,12], castle:[18,13], decos:18},
  {id:'volcan', name:'Colada de Lava', stars:3,
   desc:'Serpenteo sobre la colada volcánica. Hordas muy duras · premio x1.3.',
   seed:9001, diff:{hp:1.25,spd:1.08,bounty:1.3},
   theme:{ground:['#463636','#514040','#3f3030'],speckle:['#332626','#5e4a42'],
          path:['#6a5a4a','#756450','#615040'],speckleP:['#4a3830','#8a7a64'],
          edge:'#332626',flowers:false,deco:'lava'},
   wp:[[-1,2],[17,2],[17,6],[4,6],[4,10],[15,10],[15,13],[20,13]],
   spawn:[0,2], castle:[18,13], decos:16},
];
let MAP_LIST=MAPS; // puede sustituirse por los mapas del microservicio
// estado del mapa cargado (reconstruible)
const M={data:null,wp:[],cells:new Set(),castle:new Set(),spawn:new Set(),segs:[],len:0,ground:null,castlePx:0,castlePy:0,spawnPx:0,spawnPy:0};
function computeCells(m){
  const cells=new Set();
  for(let i=0;i<m.wp.length-1;i++){
    const [c0,r0]=m.wp[i],[c1,r1]=m.wp[i+1];
    if(r0===r1){for(let c=Math.min(c0,c1);c<=Math.max(c0,c1);c++)if(c>=0&&c<COLS)cells.add(c+','+r0);}
    else{for(let r=Math.min(r0,r1);r<=Math.max(r0,r1);r++)cells.add(c0+','+r);}
  }
  return cells;
}
function loadMap(m){
  M.data=m;
  M.wp=m.wp.map(([c,r])=>[c*CELL+8,r*CELL+8]);
  M.cells=computeCells(m);
  M.castle=new Set([m.castle[0]+','+m.castle[1],(m.castle[0]+1)+','+m.castle[1]]);
  M.spawn=new Set([m.spawn[0]+','+m.spawn[1]]);
  M.segs=[]; M.len=0;
  for(let i=0;i<M.wp.length-1;i++){
    const a=M.wp[i],b=M.wp[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    M.segs.push({x:a[0],y:a[1],dx:(b[0]-a[0])/d,dy:(b[1]-a[1])/d,len:d,start:M.len});
    M.len+=d;
  }
  M.castlePx=m.castle[0]*CELL; M.castlePy=m.castle[1]*CELL-4;
  M.spawnPx=m.spawn[0]*CELL; M.spawnPy=m.spawn[1]*CELL-4;
  M.ground=buildGround(m);
}
function pointAt(d){
  d=clamp(d,0,M.len);
  for(let i=M.segs.length-1;i>=0;i--){
    const s=M.segs[i];
    if(d>=s.start){const t=d-s.start;return{x:s.x+s.dx*t,y:s.y+s.dy*t,dx:s.dx,dy:s.dy};}
  }
  return{x:M.wp[0][0],y:M.wp[0][1],dx:1,dy:0};
}
const canBuild=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS
  &&!M.cells.has(c+','+r)&&!M.castle.has(c+','+r)&&!M.spawn.has(c+','+r);
loadMap(MAPS[0]); // mapa inicial por defecto (el menú permite elegir otro)

// ---------- DOM ----------
const $=id=>document.getElementById(id);

// ---------- audio ----------
let AC=null, muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,d,type,v,slide){
  const a=ac(); if(!a||muted)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
function noise(d,v){
  const a=ac(); if(!a||muted)return;
  try{
    const n=(a.sampleRate*d)|0, buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.value=v||0.2;
    s.connect(g); g.connect(a.destination); s.start();
  }catch(e){}
}
const SFX={
  place:()=>tone(170,0.12,'square',0.09,-70),
  sell:()=>tone(320,0.16,'triangle',0.08,160),
  up:()=>{tone(420,0.09,'square',0.07,220);setTimeout(()=>tone(640,0.1,'square',0.07,220),90);},
  shootA:()=>tone(950,0.04,'square',0.025,-350),
  fire:()=>tone(210,0.16,'sawtooth',0.05,-130),
  boom:()=>{noise(0.3,0.22);tone(90,0.25,'sine',0.16,-50);},
  zap:()=>tone(1500,0.09,'sawtooth',0.05,-1300),
  ice:()=>tone(1700,0.07,'triangle',0.045,-700),
  poison:()=>tone(260,0.12,'sine',0.05,130),
  holy:()=>tone(880,0.14,'sine',0.05,440),
  kill:()=>tone(620,0.07,'square',0.04,-220),
  leak:()=>tone(150,0.4,'sawtooth',0.1,-90),
  wave:()=>{[440,554,659].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.06),i*90));},
  over:()=>{[330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'sawtooth',0.09),i*190));},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.07),i*130));},
};

// ---------- fábrica de sprites ----------
function mkSpr(rows,pal){
  const w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w; c.height=rows.length;
  const x=c.getContext('2d');
  rows.forEach((row,y)=>{
    for(let i=0;i<row.length;i++){
      const ch=row[i]; if(ch==='.'||ch===' ')continue;
      const col=pal[ch]; if(!col)continue;
      x.fillStyle=col; x.fillRect(i,y,1,1);
    }
  });
  return c;
}
const SPR={};

// --- castillo (32x28, puerta a la derecha donde termina el camino) ---
SPR.castle=(function(){
  const w=32,h=28,rows=[];
  for(let y=0;y<h;y++){
    let row='';
    for(let x=0;x<w;x++){
      let ch='.';
      if(y===0&&(x%5===0||x%5===1))ch='s';
      else if(y>=1&&y<=24){
        if(x<24)ch='s';
        if(x>=24&&y>=10)ch='k';
      }
      if(y>=25)ch='K';
      if(ch==='s'){
        if((y===4||y===16)&&x%9===7)ch='k';
        else if(y%5===2&&x%7===3)ch='S';
      }
      if(x===9&&y<=3)ch='g';
      if((x===10||x===11)&&y===2)ch='r';
      if(x===21&&y<=3)ch='g';
      if((x===22||x===23)&&y===1)ch='r';
      row+=ch;
    }
    rows.push(row);
  }
  return mkSpr(rows,{s:'#8d8d93',S:'#6f6f76',k:'#2a2420',K:'#1a1614',g:'#b8b8c0',r:'#c0392b'});
})();

function drawDeco(x,type,c,r,Rm){
  const X=c*CELL,Y=r*CELL,rim=(a,b)=>a+Math.floor(Rm()*(b-a+1));
  if(type==='tree'){
    x.fillStyle='#5a3a1a'; x.fillRect(X+7,Y+9,2,6);
    x.fillStyle='#2f6b24'; x.fillRect(X+3,Y+4,10,7); x.fillRect(X+4,Y+2,8,8);

function buildGround(m){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const Rm=mulberry32(m.seed);
  const rim=(a,b)=>a+Math.floor(Rm()*(b-a+1));
  const th=m.theme;
  for(let r=0;r<ROWS;r++)for(let cX=0;cX<COLS;cX++){
    const isP=M.cells.has(cX+','+r);
    x.fillStyle=(isP?th.path:th.ground)[rim(0,2)];
    x.fillRect(cX*CELL,r*CELL,CELL,CELL);
    const col=isP?th.speckleP:th.speckle;
    for(let i=0;i<rim(3,7);i++){
      let dcol=col[rim(0,1)];
      const dx=cX*CELL+rim(1,14),dy=r*CELL+rim(1,14);
      if(!isP&&dcol===col[1]){
        if(m.id==='volcan')dcol='#ff7a1a'; // brasas sobre colada
        else if(m.id==='nieve')dcol='#dff8ff'; // cristales de hielo
      }
      x.fillStyle=dcol;
      if((dx+dy+i)%2===0){x.fillRect(dx,dy,Math.min(3,cX*CELL+CELL-dx),1);x.fillRect(dx+1,dy+1,1,1);}
      else{x.fillRect(dx,dy,2,1);x.fillRect(dx,dy+1,1,1);}
    }
    if(!isP&&th.flowers&&Rm()<0.07){
      x.fillStyle=Rm()<0.5?'#e8e8d8':'#ffd23e';
      x.fillRect(cX*CELL+rim(3,12),r*CELL+rim(3,12),1,1);
    }
    if(isP){
      x.fillStyle=th.edge;
      const n=(c,r2)=>M.cells.has(c+','+r2);
      if(!n(cX,r-1))x.fillRect(cX*CELL,r*CELL,CELL,1);
      if(!n(cX,r+1))x.fillRect(cX*CELL,r*CELL+CELL-1,CELL,1);
      if(!n(cX-1,r))x.fillRect(cX*CELL,r*CELL,1,CELL);
      if(!n(cX+1,r))x.fillRect(cX*CELL+CELL-1,r*CELL,1,CELL);
    }
  }
  // decoración temática (determinista por mapa)
  const free=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS
    &&!M.cells.has(c+','+r)&&!M.castle.has(c+','+r)&&!M.spawn.has(c+','+r);
  let placed=0,tries=0;
  while(placed<m.decos&&tries<500){
    tries++;
    const c=rim(0,COLS-1),r=rim(0,ROWS-1);
    if(!free(c,r))continue;
    if(th.deco!=='lava'){
      let near=false;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(M.cells.has((c+dc)+','+(r+dr)))near=true;
      if(near)continue;
    }
    drawDeco(x,th.deco,c,r,Rm);
    placed++;
  }
  return c;
}

function burst(x,y,color,n,spd,life,grav){

function ring(x,y,r0,r1,color){G.fx.push({type:'ring',x,y,r0,r1,color,t:0,dur:0.35});}
// Semántica v3: orden resist (×(1-res)) → weak (×mult) → armadura; el DOT (burn/poison) resta HP directo y omite resist/weak/armadura por diseño; holyarrow/fusión sagrada ×3 vs no-muerto con weak holy ×2 = ×6 intencional.
function applyDamage(e,raw,elem,opts){
  if(!e||e.dead||G.phase==='menu')return 0;
  opts=opts||{};
  let dmg=raw*(opts.mult||1);
  const res=(e.resist&&e.resist[elem])||0;
  dmg*=(1-res);
  const weakF=(e.weak&&e.weak[elem])||0;
  if(weakF)dmg*=weakF;
  if(opts.armor!==false&&e.armor>0)dmg=Math.max(1,dmg-e.armor);
  dmg=Math.max(0,dmg);
  if(dmg<=0)return 0;
  e.hp-=dmg;
  const col=ELEM_COLOR[elem]||'#fff';
  if(opts.float!==false){
    if(weakF)addFloat(e.x+ri(-3,3),e.y-12,Math.ceil(dmg),col,{big:true});
    else if(res>0)addFloat(e.x+ri(-3,3),e.y-12,Math.ceil(dmg),'#8a8a8a');
    else addFloat(e.x+ri(-3,3),e.y-12,Math.ceil(dmg),col);
  }
  burst(e.x,e.y,col,3,22,0.25);
  if(weakF)burst(e.x,e.y,col,2,26,0.3);
  if(e.hp<=0)killEnemy(e,opts);
  return dmg;
}
function killEnemy(e,opts){
  if(e.dead)return;
  e.dead=true;
  G.kills++;
  const b=Math.round(e.bounty*bountyMult(G.wave)*M.data.diff.bounty);
  G.gold+=b; G.goldEarned+=b;
  addFloat(e.x,e.y-16,'+'+b,'#ffd23e');
  burst(e.x,e.y,e.color,e.boss?26:10,e.boss?60:34,0.5);
  if(e.boss){ring(e.x,e.y,4,40,'#ffb340');SFX.boom();}
  SFX.kill();
  if((e.poisonDot>0)&&!(opts&&opts.noPoisonBoom)){
    // detona por veneno: nube en área
    ring(e.x,e.y,2,24,'#7ac74a');
    burst(e.x,e.y,'#a8e05a',10,30,0.4);
    for(const o of G.enemies){
      if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<=24){
        o.poisonDps=Math.max(o.poisonDps,10); o.poisonStacks+=1; o.poisonDot=Math.max(o.poisonDot,3);
      }
    }
  }
}
function applyPoison(e,dps,t,stacks,mult){
  if(e.dead)return;
  const m=(mult||1);
  if(e.poisonDps*stacks>=e.poisonDps*e.poisonStacks){
    e.poisonDps=Math.max(e.poisonDps,dps*m); e.poisonStacks+=stacks; e.poisonDot=Math.max(e.poisonDot,t);
  }else{
    e.poisonDps=dps*m; e.poisonStacks=stacks; e.poisonDot=t;
  }
  e.poisonDot=Math.min(e.poisonDot,10);
  e.poisonStacks=Math.min(e.poisonStacks,8);
}
function applyBurn(e,dps,t){
  if(e.dead)return;
  e.burnDps=Math.max(e.burnDps,dps); e.burnStacks=Math.min(e.burnStacks+1,4); e.burnT=Math.max(e.burnT,t);
}
function applySlow(e,f,t){
  if(e.dead)return;

  computeSynergies();
  updateHUD(); updateSel();
  return true;
}
function sellTower(t){
  if(!t)return;
  const refund=Math.round(t.invested*0.6);
  G.gold+=refund;
  G.towers=G.towers.filter(x=>x!==t);
  if(G.selTower===t)G.selTower=null;
  SFX.sell();
  burst(t.x,t.y,'#ffd23e',10,28,0.35);
  addFloat(t.x,t.y-10,'+'+refund,'#ffd23e');
  computeSynergies();
  updateHUD(); updateSel();
}
function computeSynergies(){
  for(const t of G.towers)t.syn=[];
  for(const a of G.towers)for(const b of G.towers){
    if(a===b)continue;
    if(dist(a,b)>SYN_RANGE)continue;
    for(const s of synIds([a.elem,b.elem])){
      if(!a.syn.includes(s))a.syn.push(s);
      if(!b.syn.includes(s))b.syn.push(s);
    }
  }
}

function updateEnemy(e,dt){
  e.animT+=dt;
  if(e.freeze>0){
    e.freeze-=dt;
  }else{
    let sp=e.spd;
    if(e.slowT>0){e.slowT-=dt;sp*=(1-e.slowF);}
    e.dist+=sp*dt;
    if(e.dist>=M.len){
      e.leaked=true;
      G.lives-=e.leak;
      SFX.leak();
      toast('¡Un enemigo entró al castillo! -'+e.leak+' ❤','#ff5a4a');
      if(G.lives<=0){G.lives=0;gameOver();}
      return;
    }
    const p=pointAt(e.dist);
    e.x=p.x; e.y=p.y;
  }
  if(e.burnT>0){
    e.burnT-=dt;
    e.burnAcc+=e.burnDps*e.burnStacks*dt;
    if(e.burnAcc>=1){
      const d=Math.floor(e.burnAcc); e.burnAcc-=d;
      e.hp-=d;
      if(Math.random()<dt*10)burst(e.x+ri(-4,4),e.y+ri(-6,2),'#ff7a1a',1,18,0.3);
      if(e.hp<=0)killEnemy(e);
    }
    if(e.burnT<=0)e.burnDps=e.burnStacks=0;
  }
  if(e.poisonDot>0){
    e.poisonDot-=dt;
    const m=(e.slowT>0||e.freeze>0)?2:1;
    e.poisonAcc+=e.poisonDps*e.poisonStacks*m*dt;
    if(e.poisonAcc>=1){
      const d=Math.floor(e.poisonAcc); e.poisonAcc-=d;
      e.hp-=d;
      if(Math.random()<dt*8)burst(e.x+ri(-3,3),e.y+ri(-5,2),'#7ac74a',1,14,0.35);
      if(e.hp<=0)killEnemy(e);
    }
    if(e.poisonDot<=0)e.poisonDps=e.poisonStacks=0;
  }
  if(e.regen&&!e.dead){e.hp=Math.min(e.maxHp,e.hp+e.regen*dt);}
}
function acquire(t){
  const lv=TOWERS[t.type].lv[t.lvl-1];
  const range=lv.range||90;
  let best=null,bd=-1;
  for(const e of G.enemies){
    if(e.dead||e.leaked)continue;
    if(Math.hypot(e.x-t.x,e.y-t.y)<=range&&e.dist>bd){best=e;bd=e.dist;}
  }
  return best;
}
function leadPos(e,T){
  const p=pointAt(e.dist);
  let sp=e.spd;
  if(e.slowT>0)sp*=(1-e.slowF);
  if(e.freeze>0)sp=0;
  return{x:e.x+p.dx*sp*T,y:e.y+p.dy*sp*T};
}
function fireTower(t,e){

      }else if(syn&&syn.id==='ember'){
        G.shots.push({kind:'volcbomb',x:t.x,y:t.y-8,tx:e.x,ty:e.y,target:e,spd:120,dmg:lv.dmg,elem:'fire',opts:{splash:(lv.splash||20)+6,burn:lv.burn,pool:{r:30,dps:9,t:3}},lvl:t.lvl,t:0,life:1.6});

    case 'ice':{

      }else if(syn&&syn.id==='necrosis'){
        G.shots.push({kind:'necroshard',x:t.x,y:t.y-8,tx:e.x,ty:e.y,target:e,spd:180,dmg:lv.dmg,elem:'ice',opts:{slow:lv.slow,poison:{dps:6,t:3,stacks:1}},lvl:t.lvl,t:0,life:1.4});

      }else if(syn&&syn.id==='frost'){
        // Lanza Glacial: ralentizante reforzado
        G.shots.push({kind:'shard',x:t.x,y:t.y-8,tx:e.x,ty:e.y,target:e,spd:180,dmg:lv.dmg,elem:'ice',opts:{slow:{f:lv.slow.f+0.1,t:lv.slow.t+0.6},lance:true},lvl:t.lvl,t:0,life:1.4});

        SFX.ice();
      }

    case 'bolt':{
      // cadena instantánea
      const chain=[e];
      for(let i=0;i<lv.chain-1;i++){
        const last=chain[chain.length-1];
        let best=null,bd=70;
        for(const o of G.enemies){
          if(o.dead||o.leaked||chain.includes(o))continue;

      G.shots.push({kind,x:t.x,y:t.y-8,sx:t.x,sy:t.y-8,tx:p.x,ty:p.y,target:e,spd:0,t:0,t0:0.55,dmg:lv.dmg,elem:'poison',opts,lvl:t.lvl,h0:14});
      SFX.poison();
      break;}
    case 'siege':{
      const p=leadPos(e,0.8);
      const ember=!!(syn&&syn.id==='ember'); // Roca Ígnea
      G.shots.push({kind:'rock',x:t.x,y:t.y-10,sx:t.x,sy:t.y-10,tx:p.x,ty:p.y,t:0,t0:0.8,dmg:lv.dmg,elem:'siege',opts:{splash:lv.splash,kb:lv.kb,ember,burn:ember?{dps:6,t:3.5}:undefined},lvl:t.lvl,h0:22});
      tone(120,0.15,'triangle',0.07,-40);
      break;}
    case 'holy':{
      const bless=!!(syn&&syn.id==='bless'); // Juicio Radiante
      const mult=e.undead?(bless?3:(t.lvl>=3?2.5:2)):(bless?1.5:1);
      G.shots.push({kind:'orb',x:t.x,y:t.y-10,tx:e.x,ty:e.y,target:e,spd:bless?260:200,dmg:lv.dmg,elem:'holy',opts:{mult,splash:bless?20:(lv.splash||0),stun:bless?0.4:0},lvl:t.lvl,t:0,life:1.4});
      SFX.holy();
      break;}
  }
}
function updateTower(t,dt){
  const lv=TOWERS[t.type].lv[t.lvl-1];
  if(lv.flame){
    // lanzallamas
    const tgt=acquire(t);
    if(tgt){
      t.angle=Math.atan2(tgt.y-t.y,tgt.x-t.x);
      for(const e of G.enemies){
        if(e.dead||e.leaked)continue;
        const dx=e.x-t.x,dy=e.y-t.y,d=Math.hypot(dx,dy);
        if(d>lv.range)continue;
        let da=Math.atan2(dy,dx)-t.angle;
        while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
        if(Math.abs(da)<=0.55){
          applyDamage(e,55*dt,'fire',{armor:false,float:false});
          e.burnDps=Math.max(e.burnDps,14); e.burnT=Math.max(e.burnT,1.2);
          if(e.hp<=0)killEnemy(e);
        }
      }
      for(let i=0;i<3;i++){
        const a=t.angle+(Math.random()-0.5)*1.0;
        const v=60+Math.random()*40;
        G.parts.push({x:t.x+Math.cos(t.angle)*6,y:t.y-4+Math.sin(t.angle)*6,
          vx:Math.cos(a)*v,vy:Math.sin(a)*v-8,life:0.3+Math.random()*0.2,max:0.5,
          color:['#ff7a1a','#ffb340','#ffe08a'][ri(0,2)],size:2,grav:0});
      }
    }
    return;
  }
  if(lv.nova){
    t.novaT-=dt;
    if(t.novaT<=0){
      if(G.enemies.some(e=>!e.dead&&!e.leaked&&Math.hypot(e.x-t.x,e.y-t.y)<=lv.nova.r)){
        t.novaT=lv.nova.cd;
        ring(t.x,t.y,6,lv.nova.r,'#8fd4ff');
        burst(t.x,t.y-6,'#b8ecff',16,40,0.4);
        for(const e of G.enemies){
          if(e.dead||e.leaked)continue;
          if(Math.hypot(e.x-t.x,e.y-t.y)<=lv.nova.r){
            applyDamage(e,lv.nova.dmg,'ice',{armor:false});
            e.freeze=Math.max(e.freeze,lv.nova.freeze);
            applySlow(e,lv.slow.f,lv.slow.t);
          }
        }
        SFX.ice();
      }else t.novaT=0.3;
    }
  }
  t.cd-=dt;
  if(t.cd>0)return;
  const e=acquire(t);
  if(!e){t.cd=0.05;return;}
  fireTower(t,e);
  t.cd=1/lv.rate;
}
function updateShot(s,dt){
  s.t+=dt;
  if(s.delay){s.delay-=dt;if(s.delay>0)return;}
  if(s.kind==='rock'||s.kind==='vial'||s.kind==='frostvial'){
    const k=s.t/s.t0;
    if(k>=1){
      impact(s);
      s.done=true;
      return;
    }
    s.x=lerp(s.sx,s.tx,k);
    s.y=lerp(s.sy,s.ty,k);
    s.h=4*s.h0*k*(1-k);
    if(s.kind==='rock'&&s.opts&&s.opts.ember&&Math.random()<dt*22){
      G.parts.push({x:s.x,y:s.y,vx:ri(-6,6),vy:ri(-12,-2),life:0.35,max:0.35,color:Math.random()<0.5?'#ff7a1a':'#ffd23e',size:1,grav:0});
    }
    if(s.kind==='frostvial'&&Math.random()<dt*14){
      G.parts.push({x:s.x,y:s.y,vx:ri(-6,6),vy:ri(-8,8),life:0.25,max:0.25,color:'#b8ecff',size:1,grav:0});
    }
    return;
  }
  // homing: arrow, shard, orb, fireball
  let tx=s.tx,ty=s.ty;
  if(s.target&&!s.target.dead&&!s.target.leaked){tx=s.target.x;ty=s.target.y-4;s.tx=tx;s.ty=ty;}
  const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);
  if(d<4){
    impact(s);
    s.done=true;
    return;
  }
  s.x+=dx/d*s.spd*dt;
  s.y+=dy/d*s.spd*dt;
  s.ang=Math.atan2(dy,dx);
  const L=s.lvl||1;
  if((s.kind==='fireball'||s.kind==='toxbomb'||s.kind==='volcbomb')&&Math.random()<dt*(14+16*L)){
    G.parts.push({x:s.x,y:s.y,vx:ri(-8,8),vy:ri(-10,4),life:0.3,max:0.3,color:s.kind==='toxbomb'?'#7ac74a':'#ff7a1a',size:L>=3?2:1,grav:0});
  }
  if((s.kind==='shard'||s.kind==='necroshard')&&Math.random()<dt*(6+8*L)){
    G.parts.push({x:s.x,y:s.y,vx:ri(-8,8),vy:ri(-8,8),life:0.25,max:0.25,color:s.kind==='necroshard'?'#a8e05a':'#b8ecff',size:1,grav:0});
  }
  if((s.kind==='frostarrow'||s.kind==='holyarrow')&&Math.random()<dt*12){
    G.parts.push({x:s.x,y:s.y,vx:ri(-4,4),vy:ri(-4,4),life:0.2,max:0.2,color:s.kind==='frostarrow'?'#b8ecff':'#ffe08a',size:1,grav:0});
  }
  if(s.kind==='orb'&&Math.random()<dt*(10+10*L)){
    G.parts.push({x:s.x,y:s.y,vx:ri(-6,6),vy:ri(-6,6),life:0.25,max:0.25,color:'#fff2c0',size:L>=3?2:1,grav:0});
  }
  if(s.t>s.life){s.done=true;}
}
function impact(s){
  const o=s.opts||{};
  const elem=o.elemOverride||s.elem;
  const L=s.lvl||1; // escalado visual por nivel de torre
  if(s.kind==='arrow'||s.kind==='holyarrow'||s.kind==='frostarrow'){
    const tx=s.target?s.target.x:s.x, ty=s.target?s.target.y:s.y;
    if(s.target&&!s.target.dead)applyDamage(s.target,s.dmg,elem,{mult:o.mult});
    if(o.slow&&s.target&&!s.target.dead)applySlow(s.target,o.slow.f,o.slow.t);
    const bc=s.kind==='holyarrow'?'#ffe08a':s.kind==='frostarrow'?'#b8ecff':(L>=3?'#ffd23e':'#e8e8d8');
    burst(tx,ty,bc,L+1,22,0.2);
    if(s.kind==='holyarrow')ring(tx,ty,1,8,'#ffe08a');
    return;
  }
  const x=s.x,y=s.y;
  if(s.kind==='fireball'||s.kind==='toxbomb'||s.kind==='volcbomb'){
    SFX.boom();
    ring(x,y,1+L,12+4*L,s.kind==='toxbomb'?'#7ac74a':'#ff7a1a');
    burst(x,y,'#ff7a1a',10+4*L,44,0.4);
    if(s.kind==='toxbomb')burst(x,y,'#7ac74a',6+3*L,36,0.4);
    else if(s.kind==='volcbomb')burst(x,y,'#ffd23e',5+3*L,34,0.35);
    else burst(x,y,'#ffe08a',5+3*L,30,0.3);
    for(const e of G.enemies){
      if(e.dead||e.leaked)continue;
      if(Math.hypot(e.x-x,e.y-y)<=(o.splash||20)){
        applyDamage(e,s.dmg,'fire');
        if(o.burn&&!e.dead)applyBurn(e,o.burn.dps,o.burn.t);
        if(o.poison&&!e.dead)applyPoison(e,o.poison.dps,o.poison.t,o.poison.stacks,1);
      }
    }
    if(o.pool)spawnPool(x,y,o.pool.r,o.pool.dps,o.pool.t);
    return;
  }
  if(s.kind==='shard'||s.kind==='necroshard'){
    if(s.target&&!s.target.dead){
      applyDamage(s.target,s.dmg,'ice');
      if(o.slow&&!s.target.dead)applySlow(s.target,o.slow.f,o.slow.t);
      if(o.poison&&!s.target.dead)applyPoison(s.target,o.poison.dps,o.poison.t,o.poison.stacks,1);
    }
    ring(x,y,1+L,6+3*L,s.kind==='necroshard'?'#a8e05a':'#8fd4ff');
    burst(x,y,s.kind==='necroshard'?'#a8e05a':'#b8ecff',4+3*L,26,0.3);
    return;
  }
  if(s.kind==='vial'||s.kind==='frostvial'){
    const col=s.kind==='frostvial'?'#8fd4ff':'#7ac74a';
    const hit=(e)=>{
      applyDamage(e,s.dmg,'poison');
      if(!e.dead){
        if(o.poison)applyPoison(e,o.poison.dps,o.poison.t,o.poison.stacks,1);
        if(o.burn)applyBurn(e,o.burn.dps,o.burn.t);
        if(o.slow)applySlow(e,o.slow.f,o.slow.t);
      }
    };
    if(o.splash>0){
      SFX.poison();
      ring(x,y,1+L,o.splash+2*L,col);
      burst(x,y,col,8+4*L,34,0.4);
      for(const e of G.enemies){
        if(e.dead||e.leaked)continue;
        if(Math.hypot(e.x-x,e.y-y)<=o.splash)hit(e);
      }
    }else{
      if(s.target&&!s.target.dead)hit(s.target);
      burst(x,y,col,4+3*L,22,0.3);
    }
    if(o.frostBoom&&s.target&&s.target.dead){
      // Vial Glacial: la muerte congela a los vecinos (área y single-target)
      for(const e of G.enemies){
        if(e.dead||e.leaked)continue;
        if(Math.hypot(e.x-x,e.y-y)<=24)e.freeze=Math.max(e.freeze,0.8);
      }
      ring(x,y,2,20,'#b8ecff');
      burst(x,y,'#b8ecff',10,30,0.4);
    }
    return;
  }
  if(s.kind==='rock'){
    SFX.boom();
    ring(x,y,1+L,(o.splash||24)+2+2*L,'#d8c8a0');
    burst(x,y,'#9a7a52',8+4*L,40,0.4,30);
    burst(x,y,'#6b5236',5+3*L,28,0.35,20);
    for(const e of G.enemies){
      if(e.dead||e.leaked)continue;
      if(Math.hypot(e.x-x,e.y-y)<=(o.splash||24)){
        applyDamage(e,s.dmg,'siege');
        if(o.kb&&!e.dead){e.dist=Math.max(0,e.dist-o.kb);const p=pointAt(e.dist);e.x=p.x;e.y=p.y;}
        if(o.burn&&!e.dead)applyBurn(e,o.burn.dps,o.burn.t);
      }
    }
    return;
  }
  if(s.kind==='orb'){
    SFX.holy();
    ring(x,y,1+L,8+3*L,'#ffe08a');
    burst(x,y,'#ffe08a',5+3*L,30,0.3);
    const hito=(e)=>{
      applyDamage(e,s.dmg,o.elem,{mult:o.mult});
      if(o.stun&&!e.dead)e.freeze=Math.max(e.freeze,o.stun);
    };
    for(const e of G.enemies){
      if(e.dead||e.leaked)continue;
      if(o.splash&&Math.hypot(e.x-x,e.y-y)<=o.splash)hito(e);
    }
    if(!o.splash&&s.target&&!s.target.dead)hito(s.target);
    return;
  }
}
function update(dt){
  G.time+=dt;
  if(G.phase==='wave'){
    G.waveTime+=dt;
    while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.waveTime){
      const s=G.spawnQueue.shift();
      spawnEnemy(s.type);
    }
  }
  for(const e of G.enemies)if(!e.dead&&!e.leaked)updateEnemy(e,dt);
  G.enemies=G.enemies.filter(e=>!e.dead&&!e.leaked);
  for(const t of G.towers)updateTower(t,dt);
  for(const s of G.shots)if(!s.done)updateShot(s,dt);
  G.shots=G.shots.filter(s=>!s.done);
  for(const f of G.fx)f.t+=dt;
  G.fx=G.fx.filter(f=>f.t<f.dur);
  for(const p of G.parts){
    p.life-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.grav)p.vy+=p.grav*dt;
  }
  G.parts=G.parts.filter(p=>p.life>0);
  for(const p of G.pools){
    p.t-=dt;
    for(const e of G.enemies){
      if(e.dead||e.leaked)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<=p.r){
        applyDamage(e,p.dps*dt,'fire',{armor:false,float:false}); // la lava ignora la armadura
      }
    }
  }
  G.pools=G.pools.filter(p=>p.t>0);
  for(const f of G.floats){f.t+=dt;f.y-=14*dt;}
  G.floats=G.floats.filter(f=>f.t<0.9);
  if(G.phase==='wave'&&!G.spawnQueue.length&&!G.enemies.length)endWave();
}

// ---------- tipografía pixel (dígitos) ----------
const DIG={'0':'010\n101\n101\n101\n010','1':'010\n110\n010\n010\n111','2':'110\n001\n010\n100\n111',
'3':'111\n001\n011\n001\n111','4':'101\n101\n111\n001\n001','5':'111\n100\n110\n001\n110',
'6':'110\n100\n111\n101\n110','7':'111\n001\n010\n010\n010','8':'110\n101\n110\n101\n110','9':'110\n101\n111\n001\n110'};
function drawNum(x,y,n,color,scale){
  const ps=Math.max(1,Math.round(scale||1)); // tamaño de "píxel" (escala)
  const adv=3*ps+1;                          // avance por dígito
  x=Math.round(x); y=Math.round(y);
  let cx=x;
  const s=n<0?'-':'';
  const str=s+String(Math.abs(Math.round(n)));
  ctx.fillStyle=color;
  if(s){ctx.fillRect(cx,y+ps,2,ps);cx+=2*ps+1;}
  for(const ch of str){
    if(DIG[ch])for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(DIG[ch][r][c]==='1'){
      ctx.fillRect(Math.round(cx+c*ps),Math.round(y+r*ps),ps,ps);
    }
    cx+=adv;
  }
}

// ---------- render ----------
const cv=$('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
// B1: sombreado pseudo-3D pixel-art
function shade(hex,pct){ // oscurece (+pct<0) o aclara (pct>0) un color hex
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=1+pct;
  r=clamp(Math.round(r*f),0,255); g=clamp(Math.round(g*f),0,255); b=clamp(Math.round(b*f),0,255);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
// color base de cada torre (paleta) para extruir la cara lateral (B3)
const TOWER_BASE={archer:'#a06a33',siege:'#a06a33',fire:'#8d8d93',ice:'#3f8fc0',bolt:'#9a9aa5',poison:'#8d8d93',holy:'#e8b830'};
// radio horizontal de sombra según tamaño real de cada sprite enemigo (B2)
const SHADOW_RX={dragon:6,golem:5,vampiro:4,brujo:4,goblin:3,orco:3,esqueleto:3,caballero:3};
function drawShadow(x,y,rx,ry,alpha){ // elipse pixel-art: filas de 1px, anchos decrecientes, sin gradientes
  x=Math.round(x); y=Math.round(y);
  rx=Math.max(1,Math.round(rx));
  ry=Math.min(3,Math.max(1,Math.round(ry)));
  ctx.fillStyle='rgba(0,0,0,'+(alpha===undefined?0.22:alpha)+')';
  for(let i=-ry;i<=ry;i++){
    const w=Math.round(rx*Math.sqrt(Math.max(0,1-(i*i)/(ry*ry))));
    if(w<=0)continue;
    ctx.fillRect(x-w,y+i,w*2,1);
  }
}
function drawTower(t){
  const spr=SPR['t_'+t.type+'_'+t.lvl];
  // B3: altura por nivel — se extruye hacia abajo (muro) y el sprite queda arriba
  const baseY=Math.round(t.y+13);        // base de la torre (donde va la sombra, B2)
  const wallH=6+t.lvl*2;                 // nivel 1 baja (8px), nivel 3 alta (12px)
  const spriteTop=baseY-wallH-16;        // la cara superior (sprite) se apoya sobre el muro
  const topOff=spriteTop-(t.y-8);        // desplazamiento vertical vs. el sprite original
  const base=TOWER_BASE[t.type]||'#a06a33';
  const wx=Math.round(t.x-6),ww=12;
  // cara lateral (muro): tono -20% del color base, base -35%
  ctx.fillStyle=shade(base,-0.2);
  ctx.fillRect(wx,baseY-wallH,ww,wallH);
  ctx.fillStyle=shade(base,-0.35);
  ctx.fillRect(wx,baseY-2,ww,2);
  // cara superior: sprite actual
  ctx.drawImage(spr,t.x-8,spriteTop);
  for(let i=0;i<t.lvl;i++){
    ctx.fillStyle='#ffd23e';
    ctx.fillRect(t.x-6+i*4,baseY-4,2,2);
    ctx.fillStyle='#8a6a14';
    ctx.fillRect(t.x-6+i*4,baseY-2,2,1);
  }
  // resplandor ambiental: los niveles altos se notan vivos (sigue al sprite)
  const tw=Math.floor(G.time*5+t.seed)%3;
  if(t.lvl>=2&&(t.type==='fire'||t.type==='poison')){
    ctx.fillStyle=t.type==='fire'?(tw===0?'#ffb340':'#ff7a1a'):(tw===0?'#b8e87a':'#7ac74a');
    ctx.fillRect(t.x-3+tw*2,t.y-13+topOff,2,1);
  }
  if(t.lvl>=2&&t.type==='ice'){
    ctx.fillStyle=tw===0?'#dff8ff':'#8fd4ff';
    ctx.fillRect(t.x+4,t.y-9+topOff-tw,1,1);
  }
  if(t.lvl>=3){
    ctx.fillStyle='#ffe08a';
    const tw3=Math.floor(G.time*4+t.seed)%2;
    ctx.fillRect(t.x-1+tw3,t.y-14+topOff,2,2);
  }
}
function drawEnemy(e){
  const arr=Array.isArray(SPR[e.spr])?SPR[e.spr]:[SPR[e.spr]];
  const spr=(arr[1]&&Math.floor(e.animT*8+e.seed)%2===1)?arr[1]:arr[0];

  const sx=Math.round(e.x-w/2), sy=Math.round(e.y-h+6+bob);

  const bw=big?w:w-2, bx=Math.round(e.x-bw/2), by=Math.round(e.y+6+bob);

  let ix=Math.round(e.x-w/2)-1,iy=Math.round(e.y-h+1);

  if(e.slowT>0||e.freeze>0){ctx.fillStyle='#8fd4ff';ctx.fillRect(ix,iy,1,1);}
  if(e.boss){
    ctx.fillStyle='#ffe08a';

function drawBolt(f){
  const k=1-f.t/f.dur,L=f.lvl||1;
  const ice=f.ice===true||f.type==='frostbolt';
  const base=ice?'rgba(143,212,255,':'rgba(138,99,255,';
  if(L>=2){ // resplandor (helado para Cadena/Rayo Glacial, violeta para rayo)
    ctx.fillStyle=base+(0.35*k).toFixed(2)+')';
    for(let i=0;i<f.pts.length-1;i++){
      const a=f.pts[i],b=f.pts[i+1];
      const steps=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2));
      for(let s2=0;s2<=steps;s2++){
        const px=Math.round(lerp(a[0],b[0],s2/steps)),py=Math.round(lerp(a[1],b[1],s2/steps));
        ctx.fillRect(px-1,py,3,1);ctx.fillRect(px,py-1,1,3);
      }
    }
  }
  ctx.fillStyle='rgba(255,255,255,'+(0.85*k).toFixed(2)+')';
  for(let i=0;i<f.pts.length-1;i++){
    const a=f.pts[i],b=f.pts[i+1];
    const steps=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1]));
    for(let s2=0;s2<=steps;s2++){
      ctx.fillRect(Math.round(lerp(a[0],b[0],s2/steps)),Math.round(lerp(a[1],b[1],s2/steps)),1,1);
    }
  }
  if(L>=3){ // nodos incandescentes en los puntos de salto
    ctx.fillStyle='rgba(255,255,255,'+(0.7*k).toFixed(2)+')';
    for(const p of f.pts)ctx.fillRect(Math.round(p[0])-1,Math.round(p[1])-1,3,3);
  }
  ctx.fillStyle=base+(0.5*k).toFixed(2)+')';
  for(const p of f.pts)ctx.fillRect(Math.round(p[0])-1,Math.round(p[1]),3,1);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(M.ground,0,0);
  // portal de aparición
  ctx.drawImage(SPR.spawn,M.spawnPx,M.spawnPy);
  // charcos de lava (Bomba Volcánica)
  for(const p of G.pools){
    const a=clamp(p.t/p.t0,0,1),r=Math.round(p.r);
    ctx.globalAlpha=0.25+0.3*a;
    for(let gy=-Math.floor(r*0.7);gy<=Math.floor(r*0.7);gy+=2){
      const w2=Math.floor(Math.sqrt(Math.max(0,r*r-gy*gy*0.49)));
      if(w2<=0)continue;
      ctx.fillStyle=(gy/2)%2===0?'#ff7a1a':'#9a2a0a';
      ctx.fillRect(Math.round(p.x-w2),Math.round(p.y+gy),w2*2,1);
    }
    ctx.globalAlpha=1;
  }
  // enlaces de sinergia
  for(const t of G.towers){
    for(const s of t.syn){
      for(const o of G.towers){
        if(o===t)continue;
        if(o.id<t.id)continue;
        if(dist(t,o)>SYN_RANGE)continue;
        if(!synIds([t.elem,o.elem]).some(x=>x.id===s.id))continue;
        ctx.fillStyle=s.color;
        ctx.globalAlpha=0.3;
        const steps=Math.ceil(dist(t,o));
        for(let i=0;i<=steps;i++){
          ctx.fillRect(Math.round(lerp(t.x,o.x,i/steps)),Math.round(lerp(t.y,o.y,i/steps)),1,1);
        }
        ctx.globalAlpha=1;
      }
    }
  }
  // B2: TODAS las sombras antes de las entidades (elipse pixel-art, sin sombra en pools: ya son suelo)
  for(const e of G.enemies){
    const rx=SHADOW_RX[e.type]||3;
    drawShadow(e.x,e.y+6,rx,rx>=5?3:2);
  }
  for(const t of G.towers)drawShadow(t.x,t.y+13,4,2);
  for(const s of G.shots){
    const h=s.h||0;
    const rx2=(s.kind==='rock'||s.kind==='volcbomb'||s.kind==='fireball')?2:1;
    drawShadow(s.x,Math.round(s.y+3+Math.min(3,Math.round(h/4))),rx2,1,0.15);
  }
  // entidades ordenadas por profundidad
  const ents=[...G.towers.map(t=>({y:t.y+13,f:()=>drawTower(t)})),...G.enemies.map(e=>({y:e.y+6,f:()=>drawEnemy(e)}))];
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents)e.f();
  // proyectiles
  for(const s of G.shots)drawShot(s);
  // efectos
  for(const f of G.fx){
    if(f.type==='ring'){
      const k=f.t/f.dur,r=lerp(f.r0,f.r1,k);
      ctx.globalAlpha=1-k;
      ctx.fillStyle=f.color;
      for(let a=0;a<24;a++){
        const aa=a/24*Math.PI*2;
        ctx.fillRect(Math.round(f.x+Math.cos(aa)*r),Math.round(f.y+Math.sin(aa)*r*0.7),1,1);
      }
      ctx.globalAlpha=1;
    }else if(f.type==='bolt'||f.type==='frostbolt'){
      drawBolt(f);
    }
  }
  // partículas
  for(const p of G.parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  ctx.globalAlpha=1;
  // castillo encima (cubre el final del camino)
  ctx.drawImage(SPR.castle,M.castlePx,M.castlePy);
  // fantasmas de construcción y rangos
  if(G.selTower){
    const t=G.selTower,lv=TOWERS[t.type].lv[t.lvl-1];
    ctx.globalAlpha=0.35;ctx.strokeStyle='#fff';
    ctx.beginPath();ctx.arc(t.x,t.y,lv.flame?lv.range:lv.range,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.strokeStyle='#ffe08a';
    ctx.strokeRect(t.c*CELL+0.5,t.r*CELL+0.5,CELL-1,CELL-1);
  }
  if(G.buildType&&G.mouse.c>=0){
    const c=G.mouse.c,r=G.mouse.r;
    const ok=canBuild(c,r)&&!towerAt(c,r)&&G.gold>=TOWERS[G.buildType].cost;
    const d=TOWERS[G.buildType],lv=d.lv[0];
    ctx.fillStyle=ok?'rgba(120,255,120,0.25)':'rgba(255,80,80,0.3)';
    ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    ctx.globalAlpha=0.6;
    ctx.drawImage(SPR['t_'+G.buildType+'_1'],c*CELL,r*CELL);
    ctx.globalAlpha=0.4;ctx.strokeStyle='#fff';
    ctx.beginPath();ctx.arc(c*CELL+8,r*CELL+8,lv.range,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  // números flotantes (big = golpe con debilidad: escala 1.5)
  for(const f of G.floats){
    ctx.globalAlpha=clamp(1-f.t/0.9,0,1);
    const sc=f.big?1.5:1;
    drawNum(f.x-Math.round(4*sc),f.y,f.txt,f.color,sc);
    ctx.globalAlpha=1;
  }
}

// ---------- bucle principal ----------
let last=performance.now(),raf=null;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;
  last=now;
  if(dt>0.05)dt=0.05;
  if(!G.paused&&(G.phase==='wave'||G.phase==='idle'||G.phase==='over'||G.phase==='win')){
    const steps=G.speed;
    for(let i=0;i<steps;i++)update(dt);
  }
  draw();
}

function toast(msg,color){
  const d=document.createElement('div');
  d.className='toast'; d.textContent=msg;
  if(color)d.style.borderColor=color;
  $('toasts').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';},1800);
  setTimeout(()=>d.remove(),2400);
}

    bs.className='ibtn gold'; bs.dataset.act='sell';

    add('<span class="ttl">'+d.name+' — '+d.cost+' oro</span>');
    add('<span class="st">'+d.desc+'</span>');

  }

const ELEM_N={physical:'físico',fire:'fuego',ice:'hielo',lightning:'rayo',poison:'veneno',siege:'sitio',holy:'sagrado'};
function bestiaryHTML(){
  const order=['goblin','orco','esqueleto','vampiro','caballero','brujo','golem','dragon'];
  const fmtMult=m=>m%1===0?m.toFixed(1):String(m); // 2→"2.0", 1.5→"1.5", 1.25→"1.25"

    const d=ENEMIES[k];

      '<span style="color:'+ELEM_COLOR[el]+'">⚔ '+ELEM_N[el]+' ×'+fmtMult(d.weak[el])+'</span>').join(' ');
    const rss=Object.keys(d.resist||{}).map(el=>
      '<span style="color:#b8a060">🛡 '+ELEM_N[el]+' -'+Math.round(d.resist[el]*100)+'%</span>').join(' ');

      (rss?'<span class="st">Resistencias:</span> '+rss:'<span class="st">Resistencias:</span> <span style="color:var(--dim)">ninguna</span>')+
      '</div>';
  }).join('');
  return '<div class="bestiary-t">BESTIARIO — ⚔ débil (×multi) · 🛡 resiste (-%)</div>'+
    '<div class="bestiary">'+cards+'</div>';

    return '/api'+p;
  }catch(e){return '';}
}

// ---------- entrada ----------
function canvasPos(ev){
  const r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left)*(W/r.width),y:(ev.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove',ev=>{
  const p=canvasPos(ev);
  G.mouse.x=p.x; G.mouse.y=p.y;
  G.mouse.c=Math.floor(p.x/CELL); G.mouse.r=Math.floor(p.y/CELL);
});
cv.addEventListener('mouseleave',()=>{G.mouse.c=-1;G.mouse.r=-1;});
cv.addEventListener('click',ev=>{
  if(G.phase==='menu')return;
  const p=canvasPos(ev);
  const c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  if(G.buildType){
    if(placeTower(G.buildType,c,r)){
      if(G.gold<TOWERS[G.buildType].cost)G.buildType=null;
      document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x.dataset.t===G.buildType));
    }
    updateSel();
    return;
  }
  const t=towerAt(c,r);
  G.selTower=t||null;
  updateSel();
});
cv.addEventListener('contextmenu',ev=>{
  ev.preventDefault();
  G.buildType=null; G.selTower=null;
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
  updateSel();
});
document.addEventListener('keydown',ev=>{
  const k=ev.key.toLowerCase();
  if(k==='escape'){G.buildType=null;G.selTower=null;document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));updateSel();}
  if(G.phase==='menu')return;
  if(k>='1'&&k<='7'){const idx=+k-1;if(TOWER_ORDER[idx])selectShop(TOWER_ORDER[idx]);}
  if(k===' '){ev.preventDefault();startWave();}
  if(k==='p'){G.paused=!G.paused;updateHUD();}
  if(k==='f'){G.speed=G.speed===1?2:1;updateHUD();}
  if(k==='m'){muted=!muted;updateHUD();}
  if(k==='u'&&G.selTower)upgradeTower(G.selTower);
  if(k==='s'&&G.selTower)sellTower(G.selTower);
});
$('btn-speed').addEventListener('click',()=>{G.speed=G.speed===1?2:1;updateHUD();});
$('btn-pause').addEventListener('click',()=>{G.paused=!G.paused;updateHUD();});
$('btn-mute').addEventListener('click',()=>{muted=!muted;updateHUD();});
$('btn-wave').addEventListener('click',startWave);

// ---------- arranque ----------
loadMap(G.maps[0]);
buildShop();
updateHUD();
updateWavePreview();
showOverlay(menuHTML());
fetchTop();
fetchRemoteMaps();
last=performance.now();
raf=requestAnimationFrame(frame);

// hook de test (no visible)
window.__test={
  G, placeTower, startWave, update, draw, SPR, mkSpr, loadMap, MAPS,
  applyDamage, ENEMIES, TOWERS, lbRow, impact, fireTower,
  step(ms){const n=Math.round(ms/16.6);for(let i=0;i<n;i++){update(0.0166);}draw();},
};
</script>
