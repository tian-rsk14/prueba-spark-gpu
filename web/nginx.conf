# Servidor del juego: estáticos + proxy exacto a los microservicios
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # juego (SPA estática)
    location / {
        try_files $uri /index.html;
    }

    # microservicio mapas  →  GET /api/maps
    location = /api/maps {
        proxy_pass http://mapas:8081/maps;
        proxy_set_header Host $host;
    }

    # microservicio clasificacion  →  POST /api/scores
    location = /api/scores {
        proxy_pass http://clasificacion:8082/;
        proxy_set_header Host $host;
    }

    # microservicio clasificacion  →  GET /api/scores/top
    location = /api/scores/top {
        proxy_pass http://clasificacion:8082/top;
        proxy_set_header Host $host;
    }
}
